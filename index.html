<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SAPI</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

  <!-- ============================================================
       SPLASH SCREEN
  ============================================================ -->
  <div id="splash" class="screen active">
    <div class="splash-container">
      <div class="splash-text-section">
        <h1 class="title">SAPI</h1>
        <p class="tagline" data-i18n="tagline"></p>
        <button id="btn-start" class="btn-primary" data-i18n="tap_to_start"></button>
      </div>
      <div class="splash-visual-section">
        <div class="glass-badge badge-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256"><path d="M216,40H176A104.11,104.11,0,0,0,72,144v24H48a8,8,0,0,0,0,16H72v24a8,8,0,0,0,16,0V184h24A104.11,104.11,0,0,0,216,80Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></path></svg>
          <span>98% Organic</span>
        </div>
        <div class="glass-badge badge-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256"><path d="M168,104A40,40,0,1,1,128,64,40,40,0,0,1,168,104Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></path><path d="M101.4,196.6a56.12,56.12,0,0,0,53.2,0L186.2,178a8,8,0,0,0-12.4-12l-31.6,18.6a40.09,40.09,0,0,1-38.4,0L72.2,166A8,8,0,0,0,59.8,178Z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></path></svg>
          <span>Vision AI</span>
        </div>
        <div class="glass-badge badge-3">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 256 256"><polyline points="88 128 176 40 216 40" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></polyline><circle cx="56" cy="192" r="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></circle><circle cx="200" cy="192" r="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></circle><line x1="80" y1="192" x2="176" y2="192" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line><line x1="176" y1="40" x2="200" y2="168" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line><line x1="88" y1="128" x2="56" y2="168" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="16"></line></svg>
          <span>Sorting...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       CAMERA VIEW
  ============================================================ -->
  <div id="camera-view" class="screen">
    <header>
      <span class="logo">SAPI</span>
      <button id="btn-lang" class="lang-toggle glass-pill"></button>
    </header>

    <div class="camera-container">
      <video id="video-feed" playsinline muted autoplay></video>
      <canvas id="capture-canvas" hidden style="display:none;"></canvas>
      <input
        id="file-upload"
        type="file"
        accept="image/*"
        capture="environment"
        hidden
        style="display:none;"
      />

      <div class="camera-overlay">
        <div class="scan-frame">
          <div class="scan-frame-inner"></div>
        </div>
      </div>

      <div class="camera-controls">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
          <span class="hint-text glass-pill" data-i18n="scan_hint"></span>
          <span class="hint-text glass-pill" data-i18n="scan_one_item" style="font-size: 0.8rem; padding: 4px 12px; font-weight: normal; background: rgba(0,0,0,0.6);"></span>
        </div>
        <button id="btn-scan" class="btn-capture">
          <div class="inner-circle"></div>
        </button>
        <label class="btn-upload-label" for="file-upload" data-i18n="upload_photo"></label>
      </div>
    </div>
  </div>

  <!-- ============================================================
       RESULT VIEW
  ============================================================ -->
  <div id="result-view" class="screen">
    <header>
      <span class="logo">SAPI</span>
      <button id="btn-lang-result" class="lang-toggle glass-pill"></button>
    </header>

    <div class="result-container">
      <!-- Identity bar: thumbnail + meta -->
      <div class="result-header stagger-item">
        <div class="result-img-wrapper">
          <img id="result-thumbnail" class="result-img" alt="Scanned waste" />
        </div>
        <div class="result-meta">
          <div class="result-badge" id="category-badge">
            <span id="category-icon"></span>
            <span id="category-name"></span>
          </div>
          <h2 id="item-name"></h2>
          <p id="reasoning-summary" style="font-size: 0.9rem; margin-top: 0.5rem; opacity: 0.9; line-height: 1.3; font-weight: 400;"></p>
        </div>
      </div>

      <!-- Feedback UI -->
      <div class="feedback-card glass-panel stagger-item" id="feedback-section">
        <p class="feedback-title" id="feedback-title" data-i18n="feedback_prompt"></p>
        <div class="feedback-actions" id="feedback-actions">
          <button id="btn-feedback-yes" class="btn-feedback">👍 <span data-i18n="feedback_yes"></span></button>
          <button id="btn-feedback-no" class="btn-feedback">👎 <span data-i18n="feedback_no"></span></button>
        </div>
        <p id="feedback-thanks" class="feedback-thanks hidden" data-i18n="feedback_thanks"></p>
      </div>

      <!-- Quick stats row -->
      <div class="quick-stats stagger-item">
        <div class="stat-pill glass-panel" id="stat-decompose">
          <svg class="stat-icon" width="20" height="20" viewBox="0 0 256 256"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm64-88a8,8,0,0,1-8,8H128a8,8,0,0,1-8-8V72a8,8,0,0,1,16,0v48h48A8,8,0,0,1,192,128Z" fill="currentColor"></path></svg>
          <div class="stat-content">
            <span class="stat-label" data-i18n="time_to_decompose"></span>
            <span class="stat-value" id="decompose-time"></span>
          </div>
        </div>
        <div class="stat-pill glass-panel" id="stat-confidence">
          <svg class="stat-icon" width="20" height="20" viewBox="0 0 256 256"><path d="M176,232a8,8,0,0,1-8,8H88a8,8,0,0,1,0-16h80A8,8,0,0,1,176,232Zm40-128a87.55,87.55,0,0,1-33.64,69.21A16.24,16.24,0,0,0,176,186v6a16,16,0,0,1-16,16H96a16,16,0,0,1-16-16v-6a16,16,0,0,0-6.23-12.66A87.59,87.59,0,0,1,40,104.49C39.74,56.83,78.26,17.14,125.88,16A88,88,0,0,1,216,104Z" fill="currentColor"></path></svg>
          <div class="stat-content">
            <span class="stat-label" data-i18n="confidence"></span>
            <div class="confidence-bar">
              <div class="confidence-fill" id="confidence-fill"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Gamification card -->
      <div class="glass-panel info-card stagger-item" id="card-gamification">
        <div class="info-card-header">
          <svg class="info-card-icon" width="22" height="22" viewBox="0 0 256 256"><path d="M224,48H32a8,8,0,0,0-8,8v43.2a32.06,32.06,0,0,0,16,27.71V208a8,8,0,0,0,8,8H208a8,8,0,0,0,8-8V126.91a32.06,32.06,0,0,0,16-27.71V56A8,8,0,0,0,224,48Zm-16,51.2a16,16,0,0,1-16,16H64a16,16,0,0,1-16-16V64H208ZM200,200H56V137.45A31.86,31.86,0,0,0,64,138.67a31.7,31.7,0,0,0,32-32V96h16v10.67a31.7,31.7,0,0,0,32,32,31.7,31.7,0,0,0,32-32V96h16v10.67a31.7,31.7,0,0,0,32,32,31.86,31.86,0,0,0,8-1.22Z" fill="currentColor"></path></svg>
          <span class="info-card-label" data-i18n="gamification_title">Pahlawan Lingkungan</span>
        </div>
        <div class="info-card-body">
          <p id="gamification-stats" style="font-weight: 600; margin-bottom: 0.5rem; font-size: 1.1rem; color: var(--card-accent);"></p>
          <p id="gamification-desc"></p>
        </div>
      </div>

      <!-- Scan again -->
      <button id="btn-scan-again" class="btn-secondary glass-panel stagger-item" data-i18n="scan_again"></button>
    </div>
  </div>

  <!-- ============================================================
       LOADING OVERLAY
  ============================================================ -->
  <div id="loading-overlay" class="full-overlay hidden">
    <div class="overlay-content">
      <div class="img-preview-box">
        <img id="loading-preview-img" alt="Scanning preview" />
        <div class="scanning-line"></div>
      </div>
      <h2 data-i18n="analyzing"></h2>
      <p id="fun-fact" class="fun-fact-text"></p>
    </div>
  </div>

  <!-- ============================================================
       ERROR OVERLAY
  ============================================================ -->
  <div id="error-overlay" class="full-overlay hidden">
    <div class="overlay-content glass-panel">
      <svg class="error-icon" width="48" height="48" viewBox="0 0 256 256" style="margin-bottom: 0.5rem; color: var(--cat-b3);"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Zm-8-80V80a8,8,0,0,1,16,0v56a8,8,0,0,1-16,0Zm20,36a12,12,0,1,1-12-12A12,12,0,0,1,140,172Z" fill="currentColor"></path></svg>
      <h2>Oops!</h2>
      <p id="error-message"></p>
      <button id="btn-retry" class="btn-primary" data-i18n="retry"></button>
      <button id="btn-error-cancel" class="btn-ghost" data-i18n="cancel"></button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
